<header class="site-header">
  <div class="header-wrapper">
    <a href="{{ '/' | relative_url }}" class="site-title">
      <span>{{ site.title }}</span>
    </a>
    {% if site.location %}<span class="site-location">{{ site.location }}</span>{% endif %}
    <nav class="main-nav">
      <ul class="nav-list">
        {% for link in site.data.navigation.main %}
        <li><a href="{{ link.url | relative_url }}" class="nav-link">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
